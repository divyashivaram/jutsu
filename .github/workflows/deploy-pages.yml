name: Deploy frontend to Pages

# Publishes frontend/ to https://divyashivaram.in/jutsu/ on every push to main,
# with config.js rewritten so the static site runs in guest mode (no backend).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          cp -r frontend site
          cat > site/scripts/config.js <<'EOF'
          // Static GitHub Pages deploy — no backend. Written by
          // .github/workflows/deploy-pages.yml; the source of truth is
          // frontend/scripts/config.js.
          export const BACKEND = false;
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
